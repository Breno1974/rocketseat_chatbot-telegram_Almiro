# Complemento usado por ambiente.cjs para testes locais com Telegram.
services:
  webhook:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./webhook.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - n8n
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://webhook:80
    depends_on:
      - webhook
